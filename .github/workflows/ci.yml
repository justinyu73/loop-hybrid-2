name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ceremony_grader compares HEAD~1:units.json; shallow checkout would
          # make the base empty and falsely mark every legacy unit newly done.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure bubblewrap for the execution-fence gates
        # The preventive execution-fence gate needs bwrap (0.9+ with seccomp)
        # plus the unprivileged-userns allowance on the runner.
        shell: bash
        run: |
          set -euo pipefail
          command -v bwrap >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          }
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Configure git identity for canaries
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Loop Hybrid CI"

      - name: Provision hermetic executor stub
        # Discovery-only: canaries resolve a coding CLI on PATH; no model is invoked.
        run: |
          printf '%s\n' '#!/usr/bin/env bash' 'echo "CI fixture codex stub: discovery-only; no model is invoked" >&2' 'exit 0' > "$RUNNER_TEMP/codex"
          chmod +x "$RUNNER_TEMP/codex"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: G6 CI conclusion smoke
        run: python3 -B lh_runtime/ci_conclusion_canary.py

      - name: Aggregate gate-pack tests
        run: npm test

      - name: In-memory Python and shell lint
        run: npm run lint

      - name: Boundary seal
        run: python3 gate-pack/boundary_seal/canary.py --json

      - name: Diff hygiene
        run: git diff --check
